# Radius-Test 内置 Dictionary
#
# 模板：Huawei
# 来源：FreeRADIUS dictionary.huawei + RADIUS属性.xlsx 表2（26-1~26-6 已按华为官方文档修正）
#
# 本文件由构建脚本生成，位于源代码内部，随程序一起分发。
# 用户如需修改，请在 Web 的 Dictionary 页面使用「派生为自定义模板」。

template: Huawei
vendor: "Huawei"
vendor_id: 2011
attributes:
  - id: 1
    name: "HW-Input-Peak-Information-Rate"
    name_zh: "入方向峰值信息速率"
    type: integer
    desc: "用户接入到NAS的报文峰值信息速率（Peak Information Rate），即最大能够通过的速率。整数形式，4字节，单位为bit/s。HW-Input-Peak-Information-Rate必须大于等于HW-Input-Committed-Information-Rate，缺省值等于HW-Input-Committed-Information-Rate。"
  - id: 2
    name: "HW-Input-Committed-Information-Rate"
    name_zh: "入方向承诺信息速率"
    type: integer
    desc: "用户接入到NAS的报文承诺信息速率（Committed Information Rate），即保证能够通过的平均速率。整数形式，4字节，单位为bit/s。"
  - id: 3
    name: "HW-Input-Committed-Burst-Size"
    name_zh: "入方向承诺突发尺寸"
    type: integer
    desc: "用户接入到NAS的报文承诺突发尺寸（Committed Burst Size），即瞬间能够通过的承诺突发流量。整数形式，4字节，单位为bit。"
  - id: 4
    name: "HW-Output-Peak-Information-Rate"
    name_zh: "出方向峰值信息速率"
    type: integer
    desc: "从NAS到用户的报文峰值信息速率。整数形式，4字节，单位为bit/s。HW-Output-Peak-Information-Rate必须大于等于HW-Output-Committed-Information-Rate，缺省值等于HW-Output-Committed-Information-Rate。"
  - id: 5
    name: "HW-Output-Committed-Information-Rate"
    name_zh: "出方向承诺信息速率"
    type: integer
    desc: "从NAS到用户的报文承诺信息速率。整数形式，4字节，单位为bit/s。"
  - id: 6
    name: "HW-Output-Committed-Burst-Size"
    name_zh: "出方向承诺突发尺寸"
    type: integer
    desc: "从NAS到用户的报文承诺突发尺寸。整数形式，4字节，单位为bit。"
