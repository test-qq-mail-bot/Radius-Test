name: build

# 构建 Windows / Linux 可执行文件，并可按版本号发布 Release。
#
# 触发规则：
#   1. push / PR 到 main：只构建，验证能否打包成功；
#   2. push tag（v*）：构建并发布 Release；
#   3. 手动运行（workflow_dispatch）勾选 release：构建并发布 Release；
#   4. push 到 main 且 src/version.py 有变动：自动构建并发布 Release。
#
# 版本号一律取自 src/version.py 的 SOFTWARE_VERSION，不手工维护 tag 数字。

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release:
        description: "是否发布 Release（用版本号作为 tag）"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    name: 读取版本号并判断是否发布
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 从 src/version.py 读取版本号
        id: version
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0, '.'); from src.version import SOFTWARE_VERSION; print(SOFTWARE_VERSION, end='')")
          if [ -z "$VERSION" ]; then
            echo "读取版本号失败" && exit 1
          fi
          echo "版本号：$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 判断是否需要发布
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_RELEASE: ${{ github.event.inputs.release }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          RELEASE=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_RELEASE" = "true" ]; then
            RELEASE=true
          elif [ "$EVENT_NAME" = "push" ] && [ "${REF#refs/tags/}" != "$REF" ]; then
            RELEASE=true
          elif [ "$EVENT_NAME" = "push" ]; then
            if git diff --name-only "$BEFORE" "$SHA" 2>/dev/null | grep -q '^src/version.py$'; then
              RELEASE=true
            fi
          fi
          echo "是否发布：$RELEASE"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

  build:
    name: 构建 ${{ matrix.os }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装运行时依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装打包依赖
        # 只装 PyInstaller 本体：requirements-build.txt 里的 pywin32-ctypes 等仅适用于 Windows
        run: pip install "pyinstaller==6.22.2"

      - name: 打包
        run: python build.py

      - name: 整理产物
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p out
          if [ -f dist/Radius-Test.exe ]; then
            cp dist/Radius-Test.exe "out/Radius-Test-${VERSION}-windows-x64.exe"
          fi
          if [ -f dist/Radius-Test ]; then
            cp dist/Radius-Test "out/Radius-Test-${VERSION}-linux-x64"
            chmod +x "out/Radius-Test-${VERSION}-linux-x64"
          fi
          ls -l out

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Radius-Test-${{ needs.prepare.outputs.version }}-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载全部平台产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -l artifacts

      - name: 创建 Release（tag 与名称均取程序版本号）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: "Radius-Test ${{ needs.prepare.outputs.version }}"
          body: |
            Radius-Test ${{ needs.prepare.outputs.version }}

            - Windows：Radius-Test-${{ needs.prepare.outputs.version }}-windows-x64.exe
            - Linux：Radius-Test-${{ needs.prepare.outputs.version }}-linux-x64

            版本号取自 src/version.py 的 SOFTWARE_VERSION。
          draft: false
          prerelease: false
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
